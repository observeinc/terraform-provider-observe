directive @goModel(model: String, models: [String!]) on OBJECT
    | INPUT_OBJECT
    | SCALAR
    | ENUM
    | INTERFACE
    | UNION

directive @goField(forceResolver: Boolean, name: String, omittable: Boolean) on INPUT_FIELD_DEFINITION
    | FIELD_DEFINITION

directive @eol on
    | INPUT_FIELD_DEFINITION
    | FIELD_DEFINITION
    | ARGUMENT_DEFINITION

"""
Marks a field, input field, or argument as carrying material that must never reach
telemetry. Two kinds qualify:

  - Credentials: passwords, minted token secrets, private keys, certificates
    (OB-63450).
  - Customer query-result data: values read out of a customer's datasets — result
    rows, column top-K values, metric tag values, monitor captured values, primary
    key values (OB-65908). Logging these copies customer data out of the
    environment that produced it and into the o2 environment our telemetry ships
    to, where it cannot be un-logged.

Secret-annotated values are redacted from tracing spans, logs, and error strings by
the GraphQL telemetry layer; marking a composite field redacts its whole subtree.
Marker only — it has no effect on the value returned to the client.
"""
directive @secret on
    | INPUT_FIELD_DEFINITION
    | FIELD_DEFINITION
    | ARGUMENT_DEFINITION

"""
Marks a field, input field, or argument whose name looks secret-like (matches the
telemetry guard-test denylist) as reviewed and safe to log — its value is neither a
credential nor customer query-result data, so it may be recorded in tracing spans,
logs, and error strings. Required — the guard test fails for any suspiciously named
field carrying neither @secret nor @allowLogging. Marker only. See OB-63450.

The guard test only checks names, so it cannot prompt this decision for a
result-carrying field with an innocuous name (paginatedResults, tagValues,
capturedValues). Those are annotated by hand; see OB-65908.
"""
directive @allowLogging on
    | INPUT_FIELD_DEFINITION
    | FIELD_DEFINITION
    | ARGUMENT_DEFINITION

enum Team @goModel(model: "observe/meta/apiowner.Team") {
    Logs
    Streaming
    Enterprise
    Intake
    AI
    APM
    Query
    Dataprocessing
}

"""
Directive to specify the owner of an API endpoint, which includes the owner team
and the lead engineer. For the lead engineer, please use their primary google
email alias (can look it up using the Google contact directory).
"""
directive @owner(team: Team!, lead: String!) on
    | FIELD_DEFINITION
    | INPUT_FIELD_DEFINITION


"""
Directive to configure which API rate limit buckets apply to this GraphQL field.
If omitted, the default buckets of api:readonlyPerUser and api:readonlyPerCustomer are used for
Query fields, and api:perUser and api:perCustomer are used for Mutation fields.
When provided, ONLY the listed buckets apply, replacing the defaults.
To enforce extra rate limits in addition to the defaults, include the default ones in the list.
To disable rate limiting for this field, set names: [].
"""
directive @rateLimits(names: [String!]) on FIELD_DEFINITION

scalar Any @goModel(model: "observe/meta/metascalar.Any")
scalar CustomerId @goModel(model: "observe/authorization/id.CustomerId")
scalar Duration @goModel(model: "observe/compiler/comptypes.Duration")
scalar Int64 @goModel(model: "observe/meta/metascalar.Int64")
scalar JsonObject @goModel(model: "observe/meta/metascalar.ObjectScalar")
scalar Number @goModel(model: "observe/meta/metascalar.Number")
scalar ObjectId @goModel(model: "observe/meta/metascalar.ObjectId")
scalar RbacResourceId @goModel(model: "observe/access/resourceid.Id")
scalar SnowflakeCursor @goModel(model: "observe/meta/metaparser.SnowflakeCursor")
scalar StatsVector @goModel(model: "observe/meta/metastats.Vector")

"""
Time presented in RFC3339 format.
"""
scalar Time @goModel(model: "observe/meta/metascalar.Time")
"""
Calendar date in ISO 8601 YYYY-MM-DD form. No timezone or time-of-day
component. Use Time for timestamps.
"""
scalar Date @goModel(model: "observe/meta/metascalar.Date")
scalar UserId @goModel(model: "observe/authorization/id.UserId")

"""
At some point in the future, we may have Segments as business objects,
and be able to bookmark them. Technically, we can bookmark bookmark groups, but
there is no current UI using that feature.
"""
enum ObjectKind @goModel(model: "observe/meta/metatypes.ObjectKind") {
  Dataset
  Worksheet
  BookmarkGroup
  Monitor
  Resource
  Dashboard
}

type TimeRange @goModel(model: "observe/meta/metatypes.TimeRange") {
    start: Time
    end: Time
}

input TimeRangeInput @goModel(model: "observe/meta/metatypes.TimeRange") {
    start: Time
    end: Time
}

type SourceLoc @goModel(model: "observe/compiler/comptypes.SourceLocation") {
    row: Int64!
    col: Int64!
}

input SourceLocInput @goModel(model: "observe/compiler/comptypes.SourceLocation") {
    row: Int64!
    col: Int64!
}

type SourceSpan @goModel(model: "observe/compiler/comptypes.SourceSpan") {
    start: SourceLoc!
    end: SourceLoc!
}

type ResultStatus @goModel(model: "observe/meta/metascalar.ResultStatus") {
    success: Boolean!
    errorMessage: String!
    detailedInfo: JsonObject @secret
}

interface ErrorInstance @goModel(model: "observe/meta/metatypes.ErrorInstance") {
    """
    When did the error last occur.
    """
    time: Time!

    """
    Error text.
    """
    errorText: String!
}

type RateLimitConfig @goModel(model: "observe/meta/metatypes.RateLimitConfig") {
    rate: Float!
    burst: Int64
}

input RateLimitInput @goModel(model: "observe/meta/metatypes.RateLimitInput") {
    rate: Float!

    burst: Int64
}
