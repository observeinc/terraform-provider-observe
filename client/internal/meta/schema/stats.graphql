    """
    Total credits available for each week for the customer before throttling. Zero if not limit is set.

    This field is deprecated - and in future should be replaced with
    limitAndUsageDetailsPerScope[i].throttledCreditLimit where
    limitAndUsageDetailsPerScope[i].scope == "Customer".
    """
    weeklyThrottledCreditLimit: Float! @allowLogging

    """
    The details of credit usage and limits for all scopes that have applicable limits.

    NOTE - this in general will return an entry for all scopes - but limits may be missing if not
    set. This is so that credit usage / billing information is still returned.
    """
    limitAndUsageDetailsPerScope: [QueryRateLimitAndUsageDetails!]!

}

"""
Per-scope governor state returned by queryRateLimitingState.
"""
type RateLimitScopeInfo @goModel(model: "observe/meta/metatypes.RateLimitScopeInfo") {
    """
    The scope to which this entry applies (Customer, User, or Dashboard).
    """
    scope: RateLimitScope!

    """
    Credits remaining in the token bucket for this scope. Null if no limit is configured.
    """
    creditsRemainingInBudget: Float @allowLogging

    """
    Maximum credits in the token bucket for this scope. Null if no limit is configured.
    """
    maxCreditsInBudget: Float @allowLogging

    """
    Estimated time until this scope exits the throttled state, assuming zero ongoing consumption.
    Null if not currently throttled or no refill is configured.
    """
    timeUntilUnthrottled: Duration

    """
    Estimated time until this scope exits the hard limit state, assuming zero ongoing consumption.
    Null if not currently at hard limit or no refill is configured.
    """
    timeUntilHardLimitExit: Duration

    """
    Credits refilled per hour for this scope. Null if no refill is configured.
    """
    refillRateCreditsPerHour: Float @allowLogging
}

"""
Lightweight snapshot of the query governor state for the requesting user.
Returned by queryRateLimitingState; intended for use when a query has been throttled.
"""
type QueryRateLimitingCurrentState @goModel(model: "observe/meta/metatypes.QueryRateLimitingCurrentState") {
    """
    Overall rate-limiting state derived from the most-restrictive active scope.
    """
    state: QueryRateLimitingState!

    """
    Whether the user is currently being throttled. Null if the governor is not configured.
    """
    throttleMode: ThrottledInfo

    """
    Per-scope governor state. Contains an entry for each scope (Customer, User, and optionally
    Dashboard) for which limits are configured.
    """
    scopeInfo: [RateLimitScopeInfo!]!
}