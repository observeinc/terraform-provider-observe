fragment Dataset on Dataset {
	workspaceId
	id
	name
	freshnessDesired
	description
	iconUrl
	accelerationDisabled
	accelerationDisabledSource
	accelerationType
	version
	lastSaved
	pathCost
	source
	managedById
	dataTableViewState
	storageIntegrationId
	validFromField
	validToField
	foreignKeys {
		label
		targetDataset
		srcFields
		dstFields
	}
	transform {
		current {
			query {
				outputStage
				# @genqlient(flatten: true)
				stages {
					...StageQuery
				}
			}
		}
	}
	typedef {
		label
		def {
			anykey
			fields {
				name
				type {
					rep
					nullable
				}
				isEnum
				isSearchable
				isHidden
				isConst
				isMetric
			}
		}
	}
	sourceTable {
		schema
		partitions {
			name
		}
		sourceUpdateTableName
		isInsertOnly
		batchSeqField
		validFromField
		fields {
			name
			sqlType
		}
	}
	correlationTagMappings {
		tag
		path {
			column
			path
		}
	}
	# @genqlient(typename: "ObjectTagMapping")
	objectTags {
		key
		values
	}
}

fragment DatasetIdName on Dataset {
	name
	id
}

fragment DatasetMaterialization on DatasetMaterialization {
	# @genqlient(flatten: true)
	dataset {
		...DatasetIdName
	}
}

fragment DatasetError on DatasetError {
	datasetId
	datasetName
	text
	hasExistingError
}

fragment DatasetSaveResult on DatasetSaveResult {
	# @genqlient(flatten: true)
	dataset {
		...Dataset
	}
	# @genqlient(flatten: true)
	errorDatasets {
		...DatasetError
	}
}

# DatasetDryRunSaveResult is the default preflight selection. It carries the validation
# outcome and nothing else.
#
# Deliberately does not select dematerializedDatasets: the backend answers that field by
# running a synchronous transformer graph walk (~11.5s per call), which is why it sits behind
# a response field mask server-side. Selecting it here made every terraform plan pay for a
# list almost no caller reads. Callers that do read it use
# DatasetDryRunRematerializationSaveResult below.
fragment DatasetDryRunSaveResult on DatasetSaveResult {
	# @genqlient(flatten: true)
	errorDatasets {
		...DatasetError
	}
}

# DatasetDryRunRematerializationSaveResult adds the list of datasets a save would
# dematerialize. Only rematerialization_mode = must_skip_rematerialization reads it, to turn a
# non-empty list into a hard error. See the comment on DatasetDryRunSaveResult for the cost.
fragment DatasetDryRunRematerializationSaveResult on DatasetSaveResult {
	# @genqlient(flatten: true)
	errorDatasets {
		...DatasetError
	}
	# @genqlient(flatten: true)
	dematerializedDatasets {
		...DatasetMaterialization
	}
}

# @genqlient(for: "DatasetInput.deleted", omitempty: true)
# @genqlient(for: "DatasetInput.accelerationDisabled", omitempty: true)
# @genqlient(for: "DatasetInput.accelerationDisabledSource", omitempty: true)
# @genqlient(for: "InputDefinitionInput.stageID", omitempty: true)
# @genqlient(for: "InputDefinitionInput.stageId", omitempty: true)
# @genqlient(for: "StageQueryInput.id", omitempty: true)
# @genqlient(for: "PrimitiveValueInput.bool", omitempty: true)
# @genqlient(for: "PrimitiveValueInput.float64", omitempty: true)
# @genqlient(for: "PrimitiveValueInput.int64", omitempty: true)
# @genqlient(for: "PrimitiveValueInput.string", omitempty: true)
# @genqlient(for: "PrimitiveValueInput.timestamp", omitempty: true)
# @genqlient(for: "PrimitiveValueInput.duration", omitempty: true)
mutation saveDataset(
	$workspaceId: ObjectId!,
	$dataset: DatasetInput!,
	$query: MultiStageQueryInput!,
	$dep: DependencyHandlingInput
) {
	# @genqlient(flatten: true)
	datasetSaveResult: saveDataset(workspaceId:$workspaceId, dataset:$dataset, query:$query, dependencyHandling:$dep) {
		...DatasetSaveResult
	}
}

mutation saveDatasetDryRun(
	$workspaceId: ObjectId!,
	$dataset: DatasetInput!,
	$query: MultiStageQueryInput!,
	$dep: DependencyHandlingInput
) {
	# @genqlient(flatten: true)
	datasetSaveResult: saveDataset(workspaceId:$workspaceId, dataset:$dataset, query:$query, dependencyHandling:$dep) {
		...DatasetDryRunSaveResult
	}
}

mutation saveDatasetDryRunWithRematerialization(
	$workspaceId: ObjectId!,
	$dataset: DatasetInput!,
	$query: MultiStageQueryInput!,
	$dep: DependencyHandlingInput
) {
	# @genqlient(flatten: true)
	datasetSaveResult: saveDataset(workspaceId:$workspaceId, dataset:$dataset, query:$query, dependencyHandling:$dep) {
		...DatasetDryRunRematerializationSaveResult
	}
}

query getDataset($id: ObjectId!) {
	# @genqlient(flatten: true)
	dataset: dataset(id: $id) {
		...Dataset
	}
}

mutation deleteDataset($id: ObjectId!,  $dep: DependencyHandlingInput) {
	# @genqlient(flatten: true)
	resultStatus: deleteDataset(dsid: $id, dependencyHandling:$dep) {
		...ResultStatus
	}
}

query lookupDataset($workspaceId: ObjectId!, $name: String!) {
	dataset: workspace(id: $workspaceId) {
		# @genqlient(flatten: true, pointer: true)
		dataset(label: $name) {
			...Dataset
		}
	}
}

query listDatasets{
	datasets: projects {
		# @genqlient(flatten: true)
		datasets {
			...Dataset
		}
	}
}

query listDatasetsIdNameOnly {
	datasets: datasetSearch {
		# @genqlient(flatten: true)
		dataset {
			...DatasetIdName
		}
	}
}

# @genqlient(for: "DatasetFieldTypeInput.nullable", omitempty: true)
# @genqlient(for: "DatasetInput.deleted", omitempty: true)
# @genqlient(for: "DatasetInput.accelerationDisabled", omitempty: true)
# @genqlient(for: "DatasetInput.accelerationDisabledSource", omitempty: true)
# @genqlient(for: "InputDefinitionInput.stageID", omitempty: true)
# @genqlient(for: "InputDefinitionInput.stageId", omitempty: true)
# @genqlient(for: "StageQueryInput.id", omitempty: true)
# @genqlient(for: "SourceTableDefinitionInput.isInsertOnly", omitempty: true)
# @genqlient(for: "PrimitiveValueInput.bool", omitempty: true)
# @genqlient(for: "PrimitiveValueInput.float64", omitempty: true)
# @genqlient(for: "PrimitiveValueInput.int64", omitempty: true)
# @genqlient(for: "PrimitiveValueInput.string", omitempty: true)
# @genqlient(for: "PrimitiveValueInput.timestamp", omitempty: true)
# @genqlient(for: "PrimitiveValueInput.duration", omitempty: true)
mutation saveSourceDataset(
	$workspaceId: ObjectId!,
	$datasetDefinition: DatasetDefinitionInput!,
	$sourceTable: SourceTableDefinitionInput!,
	$dep: DependencyHandlingInput
) {
	dataset: saveSourceDataset(workspaceId:$workspaceId, datasetDefinition:$datasetDefinition, sourceTable:$sourceTable, dependencyHandling:$dep) {
		# @genqlient(flatten: true)
		dataset {
			...Dataset
		}
	}
}

