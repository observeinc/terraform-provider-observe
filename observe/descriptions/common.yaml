
schema:
  workspace: |
    OID of the workspace this object is contained in.
    This field is optional and deprecated. Since each customer has exactly
    one workspace, the server automatically assigns the correct workspace.
  id: |
    Resource ID for this object.
  type:
    Resource type for this object.
  version: |
    Resource version for this object.
  oid: |
    OID (Observe ID) for this object. This is the canonical identifier that
    should be used when referring to this object in terraform manifests.
  opal_version: |
    OPAL language version used to compile this object's query. Supported values
    are "v2021_01_01" and "v2026_09_30". If omitted, the provider-level
    default_opal_version is used; if neither is set, Observe uses the earliest
    version.
  opal_version_rematerialization: |
    Changing this value may cause the dataset to rematerialize.
  icon_url:
    Icon to be displayed for this object. Icons are sourced from the [fluency-filled](https://icons8.com/icons/fluency-systems-filled) icon set.
  folder: |
   Observe folder OID for this object.
  object_tags: |
    Object tags for organizing and categorizing workspace objects. Map keys are tag names, values are comma-separated lists. Values are parsed as CSV format for proper escaping. Leading/trailing spaces are automatically trimmed, internal spaces are preserved. Values containing commas must be quoted using CSV escaping.

