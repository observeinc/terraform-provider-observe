description: |
  Manages the default dashboard for a correlation tag. This dashboard is
  displayed in the UI when pivoting on the tag.

  The binding is keyed only by correlation tag name (customer-wide), not by
  workspace. There is one default dashboard per tag name.
description_data_source: |
  Fetches the default dashboard OID for the specified correlation tag.

  The binding is keyed only by correlation tag name (customer-wide), not by
  workspace. There is one default dashboard per tag name.
schema:
  tag: >
    The correlation tag name whose default dashboard is being managed.
  tag_data_source: >
    The correlation tag name whose default dashboard is being looked up.
  dashboard: >
    The OID of the default dashboard for the tag.
  dashboard_data_source: >
    The OID of the default dashboard for the tag. Empty when the tag has no
    default dashboard bound.
