description: |
  Registers an inbound Snowflake share with Observe, so that its tables can be tracked with `observe_inbound_share_table`.

  -> **Preview:** Inbound shares are in private preview and must be enabled for your tenant. The schema may change.

  Before registration, the share must be granted to Observe's consumer account (see `observe_inbound_share_setup`). The first share registered from a provider account must also prove ownership: set the share comment to a token from `observe_inbound_share_registration_token`. Later shares from an already-verified provider account skip that check.

  Creating this resource mounts the share in Observe, so it is `Active` once created. If Observe cannot mount it, the apply fails without registering the share, so applying again retries. It also fails if the share is already registered in Observe; import it instead.

  Destroying this resource drops the share from Observe. It fails while the share still has tracked tables.

schema:
  share_name: |
    Name of the Snowflake share in the provider account. Unquoted names are case-insensitive; wrap the name in double quotes for a case-sensitive name. State holds the name as Snowflake resolves it, quoted when it is not all upper case. Changing this forces a new resource.
  provider_account: |
    Org-qualified Snowflake account that provides the share, as `<ORG>.<ACCOUNT>` (for example `ACME_CORP.PROD`). Not an account locator or URL. Changing this forces a new resource.
  label: |
    User-facing label for the share in Observe. Defaults to the share name; removing it resets the label to the share name.
  provider_type: |
    Type of share provider. Always `Snowflake`.
  status: |
    Lifecycle state of the share (`Creating`, `Active`, `Deleting`, `Unknown`).
  health: |
    Health status of the share (`Healthy`, `Unhealthy`, `Unknown`).
  health_message: |
    Human-readable health status message.
  last_health_check: |
    Timestamp of the last health check.
  table_count: |
    Number of tracked tables in the share.
  created_at: |
    Creation timestamp.
  updated_at: |
    Last update timestamp.
