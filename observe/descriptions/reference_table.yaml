description: |
  A reference table represents a source of non-temporal data being ingested into Observe.

schema:
  source_file: |
    The path to a CSV file containing the reference table data.
  checksum: |
    MD5 checksum of the source file.
  label: |
    The name of the reference table name. Must be unique within workspace.
  description: |
    Description for the reference table.
  dataset: |
    The Observe ID for the dataset managed by the reference table.
  primary_key: |
    The primary key of the reference table.
  label_field: |
    The field that should be used for the OPAL label.
  allow_row_edits: |
    Keep rows edited in Observe, in the UI or through the API. Editing rows clears the reference table's checksum, so by default the next apply uploads `source_file` again and replaces the edited rows. When `true`, the provider keeps the checksum of the last uploaded file and uploads `source_file` only when `checksum`, `schema`, `primary_key`, or `label_field` changes. Every upload replaces all rows, including edited ones. Set this before rows are edited: if the table already has edits when you enable it or import the table, the next apply uploads `source_file` once. Setting it back to `false` uploads `source_file` in that same apply if rows were edited, although the plan shows only the `allow_row_edits` change. Defaults to `false`.
  schema:
    description: |
      The schema of the reference table. Must match the columns in the source file.
    name: |
      The name of the column.
    type: |
      The type of the column. See https://docs.observeinc.com/en/latest/content/query-language-reference/OPALUserGuideTypesOperators.html for options.
